##manual search: type curl -d paste the url link -o write the output directory

# specify file path to analysis directory
wdir: "/otc-genomics/IOWseq000082_BDprom/Intermediate_results/Thalassiosira_pseudonana"

# configure threads for parallelization
threads: 1 # default if threads are not specified in the rule
parallel_threads: 48


#specify the organism from which to download the .gtf.gz and .fasta files
gtf_link: "http://ftp.ensemblgenomes.org/pub/protists/current/gtf/thalassiosira_pseudonana/Thalassiosira_pseudonana.ASM14940v2.62.gtf.gz"
genome_link: "http://ftp.ensemblgenomes.org/pub/protists/current/fasta/thalassiosira_pseudonana/dna/Thalassiosira_pseudonana.ASM14940v2.dna_sm.toplevel.fa.gz"

# Specify the taxon for which to retrieve RNA-seq experiments
tax_id: "35128"

# sepcify thresholds for filtering metadata
min_read_counts: 5000000
min_n_runs: 5
seq_technology: "ILLUMINA,BGISEQ,DNBSEQ"
only_keep_pubmed: "FALSE"

dist_max: 600
cor_min= 0.5
slope_diff: 2
median_diff: 1.5
detect_f: 0.5
